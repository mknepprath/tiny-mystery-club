<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" shape-rendering="crispEdges">
  <!-- Smoke -->
  <rect x="21" y="0" width="1" height="1" fill="#CCC" opacity="0.4"/>
  <rect x="20" y="1" width="1" height="1" fill="#CCC" opacity="0.6"/>
  <!-- Chimney -->
  <rect x="20" y="2" width="3" height="6" fill="#8B4513"/>
  <rect x="19" y="1" width="5" height="1" fill="#A0522D"/>
  <!-- Roof -->
  <rect x="14" y="2" width="2" height="1" fill="#B54848"/>
  <rect x="13" y="3" width="4" height="1" fill="#B54848"/>
  <rect x="11" y="4" width="8" height="1" fill="#B54848"/>
  <rect x="9" y="5" width="12" height="1" fill="#B54848"/>
  <rect x="7" y="6" width="16" height="1" fill="#CD5C5C"/>
  <rect x="5" y="7" width="20" height="1" fill="#CD5C5C"/>
  <rect x="3" y="8" width="24" height="1" fill="#CD5C5C"/>
  <rect x="1" y="9" width="28" height="1" fill="#B54848"/>
  <!-- Walls -->
  <rect x="3" y="10" width="24" height="10" fill="#E8B87A"/>
  <rect x="3" y="20" width="7" height="7" fill="#E8B87A"/>
  <rect x="20" y="20" width="7" height="7" fill="#E8B87A"/>
  <!-- Wall shading under the eaves -->
  <rect x="3" y="10" width="24" height="1" fill="#D6A468"/>
  <!-- Left window -->
  <rect x="6" y="13" width="6" height="6" fill="#8B5E3C"/>
  <rect x="7" y="14" width="4" height="4" fill="#87CEEB"/>
  <rect x="9" y="14" width="1" height="4" fill="#6BAACC"/>
  <rect x="7" y="16" width="4" height="1" fill="#6BAACC"/>
  <!-- Right window -->
  <rect x="18" y="13" width="6" height="6" fill="#8B5E3C"/>
  <rect x="19" y="14" width="4" height="4" fill="#87CEEB"/>
  <rect x="21" y="14" width="1" height="4" fill="#6BAACC"/>
  <rect x="19" y="16" width="4" height="1" fill="#6BAACC"/>
  <!-- Doorway trim, framing the door tile below -->
  <rect x="9" y="19" width="12" height="1" fill="#8B5E3C"/>
  <rect x="9" y="20" width="1" height="7" fill="#8B5E3C"/>
  <rect x="20" y="20" width="1" height="7" fill="#8B5E3C"/>
  <!-- Foundation -->
  <rect x="2" y="27" width="8" height="3" fill="#6B5B4F"/>
  <rect x="20" y="27" width="8" height="3" fill="#6B5B4F"/>
  <rect x="2" y="27" width="8" height="1" fill="#7D6B5D"/>
  <rect x="20" y="27" width="8" height="1" fill="#7D6B5D"/>
</svg>
