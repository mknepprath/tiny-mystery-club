<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10" shape-rendering="crispEdges">
  <!-- Door frame -->
  <rect x="0" y="0" width="10" height="8" fill="#8B5E3C"/>
  <!-- Door -->
  <rect x="1" y="0" width="8" height="8" fill="#5B8C5A"/>
  <rect x="1" y="0" width="8" height="1" fill="#4A7549"/>
  <!-- Panels -->
  <rect x="2" y="2" width="2" height="2" fill="#4A7549"/>
  <rect x="6" y="2" width="2" height="2" fill="#4A7549"/>
  <!-- Knob -->
  <rect x="7" y="5" width="1" height="1" fill="#E8C15C"/>
  <!-- Step -->
  <rect x="0" y="8" width="10" height="2" fill="#6B5B4F"/>
  <rect x="0" y="8" width="10" height="1" fill="#7D6B5D"/>
</svg>
