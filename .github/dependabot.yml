version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
    time: "10:00"
  open-pull-requests-limit: 10
  # React refuses to run when react and react-dom are on different versions:
  # "Incompatible React versions: The "react" and "react-dom" packages must have
  # the exact same version." Dependabot raised them as separate pull requests, so
  # each one bumped half the pair and failed its Vercel build on its own — the
  # versions only agree once both land, which separate PRs can never do.
  groups:
    react:
      patterns:
      - react
      - react-dom
      - "@types/react"
      - "@types/react-dom"
  ignore:
  - dependency-name: "@types/node"
    versions:
    - 14.14.37
    - 15.0.0
  - dependency-name: cypress
    versions:
    - 7.0.0
